<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1290" viewBox="0 0 1100 1290" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect width="1100" height="1290" fill="#ffffff"/>

  <text x="150" y="66" font-size="30" font-weight="700" fill="#111827">ESG Document Intelligence Pipeline</text>
  <text x="150" y="96" font-size="15" fill="#6b7280">Sustainability report PDFs → a citation-gated retrieval corpus</text>

  <!-- 1 ACQUIRE -->
  <rect x="150" y="140" width="800" height="88" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="192" cy="184" r="17" fill="#e5e7eb"/>
  <text x="192" y="190" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">1</text>
  <text x="228" y="178" font-size="19" font-weight="700" fill="#111827">Acquire</text>
  <text x="228" y="202" font-size="14" fill="#6b7280">Download PDFs from Drive · OCR scanned reports out-of-band</text>
  <text x="920" y="178" font-size="20" font-weight="700" fill="#374151" text-anchor="end">481</text>
  <text x="920" y="200" font-size="13" fill="#9ca3af" text-anchor="end">documents · 124 tickers</text>
  <line x1="550" y1="228" x2="550" y2="256" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 PARSE -->
  <rect x="150" y="258" width="800" height="88" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="192" cy="302" r="17" fill="#e5e7eb"/>
  <text x="192" y="308" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">2</text>
  <text x="228" y="296" font-size="19" font-weight="700" fill="#111827">Parse</text>
  <text x="228" y="320" font-size="14" fill="#6b7280">Text + a page↔character map. Multi-column pages are rebuilt from word coordinates</text>
  <text x="920" y="296" font-size="20" font-weight="700" fill="#374151" text-anchor="end">28,249</text>
  <text x="920" y="318" font-size="13" fill="#9ca3af" text-anchor="end">pages · 0 failed</text>
  <line x1="550" y1="346" x2="550" y2="374" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 SECTION -->
  <rect x="150" y="376" width="800" height="88" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="192" cy="420" r="17" fill="#e5e7eb"/>
  <text x="192" y="426" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">3</text>
  <text x="228" y="414" font-size="19" font-weight="700" fill="#111827">Section</text>
  <text x="228" y="438" font-size="14" fill="#6b7280">Split into topic sections, each an exact character span of the parsed text</text>
  <text x="920" y="414" font-size="20" font-weight="700" fill="#374151" text-anchor="end">22,807</text>
  <text x="920" y="436" font-size="13" fill="#9ca3af" text-anchor="end">sections</text>
  <line x1="550" y1="464" x2="550" y2="492" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 CHUNK -->
  <rect x="150" y="494" width="800" height="88" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="192" cy="538" r="17" fill="#e5e7eb"/>
  <text x="192" y="544" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">4</text>
  <text x="228" y="532" font-size="19" font-weight="700" fill="#111827">Chunk</text>
  <text x="228" y="556" font-size="14" fill="#6b7280">100–600 tokens. Every chunk is proven to match its cited source span</text>
  <text x="920" y="532" font-size="20" font-weight="700" fill="#374151" text-anchor="end">39,575</text>
  <text x="920" y="554" font-size="13" fill="#9ca3af" text-anchor="end">chunks</text>
  <line x1="550" y1="582" x2="550" y2="610" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 LAYOUT QA -->
  <rect x="150" y="612" width="800" height="88" rx="10" fill="#fef6f5" stroke="#eed4d0"/>
  <circle cx="192" cy="656" r="17" fill="#b0453a"/>
  <text x="192" y="662" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="228" y="650" font-size="19" font-weight="700" fill="#111827">Layout check</text>
  <rect x="374" y="635" width="52" height="19" rx="9" fill="#b0453a"/>
  <text x="400" y="649" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GATE</text>
  <text x="228" y="674" font-size="14" fill="#6b7280">Holds back pages whose reading order can't be defended — mostly dense tables</text>
  <text x="920" y="650" font-size="20" font-weight="700" fill="#b0453a" text-anchor="end">5,407</text>
  <text x="920" y="672" font-size="13" fill="#9ca3af" text-anchor="end">pages held</text>
  <line x1="550" y1="700" x2="550" y2="728" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 VLM -->
  <rect x="150" y="730" width="800" height="88" rx="10" fill="#f8f6fd" stroke="#ded5f0"/>
  <circle cx="192" cy="774" r="17" fill="#6b4bab"/>
  <text x="192" y="780" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="228" y="768" font-size="19" font-weight="700" fill="#111827">Vision model</text>
  <rect x="380" y="753" width="132" height="19" rx="9" fill="#6b4bab"/>
  <text x="446" y="767" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GATE + RECOVERY</text>
  <text x="228" y="792" font-size="14" fill="#6b7280">Catches scrambled tables the layout check missed, and re-reads held pages</text>
  <text x="920" y="768" font-size="20" font-weight="700" fill="#6b4bab" text-anchor="end">4,609</text>
  <text x="920" y="790" font-size="13" fill="#9ca3af" text-anchor="end">pages recovered</text>
  <line x1="550" y1="818" x2="550" y2="846" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 7 MANIFEST -->
  <rect x="150" y="848" width="800" height="88" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="192" cy="892" r="17" fill="#e5e7eb"/>
  <text x="192" y="898" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">7</text>
  <text x="228" y="886" font-size="19" font-weight="700" fill="#111827">Eligibility manifest</text>
  <text x="228" y="910" font-size="14" fill="#6b7280">One decision per chunk. Nothing is deleted — exclusions are reversible</text>
  <text x="920" y="886" font-size="20" font-weight="700" fill="#374151" text-anchor="end">44,054</text>
  <text x="920" y="908" font-size="13" fill="#9ca3af" text-anchor="end">candidate chunks</text>

  <!-- split -->
  <path d="M 550 936 L 550 958 L 340 958 L 340 986" fill="none" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 550 936 L 550 958 L 760 958 L 760 986" fill="none" stroke="#9aa3af" stroke-width="2" marker-end="url(#a)"/>

  <rect x="150" y="988" width="380" height="120" rx="10" fill="#f1f8f3" stroke="#cbe3d4"/>
  <text x="178" y="1022" font-size="14" font-weight="700" fill="#2e7d5b" letter-spacing="0.5">ELIGIBLE FOR RETRIEVAL</text>
  <text x="178" y="1064" font-size="34" font-weight="700" fill="#2e7d5b">26,986</text>
  <text x="178" y="1090" font-size="13.5" fill="#6b7280">22,399 from text · 4,587 from the vision model</text>

  <rect x="570" y="988" width="380" height="120" rx="10" fill="#fdf4f3" stroke="#eed4d0"/>
  <text x="598" y="1022" font-size="14" font-weight="700" fill="#b0453a" letter-spacing="0.5">WITHHELD BY THE GATES</text>
  <text x="598" y="1064" font-size="34" font-weight="700" fill="#b0453a">17,068</text>
  <text x="598" y="1090" font-size="13.5" fill="#6b7280">12,381 held pages · 4,381 scrambled tables · 306 policy</text>

  <!-- principle -->
  <rect x="150" y="1140" width="800" height="62" rx="10" fill="#fffaf2" stroke="#f0e2ca"/>
  <text x="178" y="1168" font-size="14" font-weight="700" fill="#9a6b1e">The design principle: fail closed.</text>
  <text x="178" y="1190" font-size="13.5" fill="#7a6440">Content the pipeline cannot vouch for is withheld, not shipped. Confidently wrong text is worse than absent text.</text>

  <text x="150" y="1244" font-size="12.5" fill="#9ca3af">Verified against live data, 20 July 2026 · every stage is resume-safe and incremental · full detail in ESG_PIPELINE_OVERVIEW.docx</text>
</svg>
